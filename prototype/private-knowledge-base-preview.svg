  <g transform="translate(55 972)"><rect width="1330" height="38" rx="19" fill="#202228"/><text x="28" y="25" font-size="13" font-weight="700" fill="#fff">完整 HTML 另含：个人中心入口、新建知识库、详情页、解析进度、失败重试、来源选择、生成结果、答题引用、删除确认与空状态（共 12 屏）</text></g>
