      <g transform="translate(25 225)"><rect width="44" height="44" rx="12" fill="#ffd93d" stroke="#202228" stroke-width="2"/><text x="10" y="30" font-size="22">🗂</text><rect x="58" width="295" height="76" rx="5 14 14 14" fill="#dff7e9" stroke="#202228" stroke-width="2"/><text x="73" y="27" class="b" font-size="13">私有资料检索完成</text><text x="73" y="51" class="s">从 4 份文档找到 8 个相关片段。</text></g>
      <g transform="translate(25 325)"><rect width="44" height="44" rx="12" fill="#ffd93d" stroke="#202228" stroke-width="2"/><text x="10" y="30" font-size="22">🧭</text><rect x="58" width="295" height="85" rx="5 14 14 14" fill="#dff7e9" stroke="#202228" stroke-width="2"/><text x="73" y="27" class="b" font-size="13">需要补充公开背景</text><text x="73" y="51" class="s">只使用主题关键词联网，</text><text x="73" y="69" class="s">不发送私有原文。</text></g>
      <g transform="translate(25 435)"><rect width="44" height="44" rx="12" fill="#ffd93d" stroke="#202228" stroke-width="2"/><text x="11" y="30" font-size="22">✦</text><rect x="58" width="295" height="68" rx="5 14 14 14" fill="#fff" stroke="#202228" stroke-width="2"/><text x="73" y="27" class="b" font-size="13">正在生成 5 道题</text><text x="73" y="51" class="s">●　●　●</text></g>
      <g transform="translate(25 530)" opacity=".5"><rect width="44" height="44" rx="12" fill="#fff" stroke="#202228" stroke-width="2"/><text x="12" y="30" font-size="22">✓</text><rect x="58" width="295" height="57" rx="5 14 14 14" fill="#fff" stroke="#202228" stroke-width="2"/><text x="73" y="35" class="b" font-size="13">质量检查与保存</text></g>
      <rect x="23" y="625" width="359" height="53" fill="#fff4cf"/><rect x="23" y="625" width="5" height="53" fill="#ff8c42"/><text x="40" y="657" class="s">预计还需约 8 秒，离开页面也不会中断。</text>
      <rect x="23" y="694" width="359" height="43" rx="13" fill="#fff" stroke="#202228" stroke-width="3"/><text x="142" y="721" class="btn">查看完成状态</text>
