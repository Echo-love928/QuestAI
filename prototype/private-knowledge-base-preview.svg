  <g transform="translate(518 132)"><text x="0" y="25" class="n">05</text><text x="55" y="24" class="ct">上传与校验</text><text x="55" y="45" class="s">限制清晰，隐私可感知</text>
    <g transform="translate(0 67)" filter="url(#hard)"><rect width="405" height="760" rx="38" fill="#fff8d8" stroke="#202228" stroke-width="4"/><rect x="146" width="113" height="29" rx="0 0 18 18" fill="#202228"/><line x1="0" y1="77" x2="405" y2="77" stroke="#202228" stroke-opacity=".12" stroke-width="2"/><text x="20" y="52" font-size="25">‹</text><text x="166" y="52" class="nav">上传资料</text><rect x="320" y="29" width="66" height="29" rx="16" fill="#fff" stroke="#bbb49d"/><text x="332" y="49" class="nav">••  ◉</text>
      <text x="23" y="128" class="h">把资料交给鱼仔，</text><text x="23" y="164" class="h">它会一页页读。</text><text x="23" y="190" class="sub">本次上传到“客服新人训练营”</text>
      <rect x="23" y="220" width="359" height="166" rx="19" fill="#fff" stroke="#202228" stroke-width="3" stroke-dasharray="9 7"/><text x="179" y="278" font-size="38">📎</text><text x="145" y="320" class="b">选择聊天文件</text><text x="120" y="348" class="sub">PDF、DOC、DOCX、Markdown</text>
      <g transform="translate(26 418)"><text y="0" class="s">✓　单个文件不超过 10MB</text><text y="34" class="s">✓　支持文本 PDF，不支持扫描件 OCR</text><text y="68" class="s">✓　不支持加密或设有密码的文件</text><text y="102" class="s">✓　上传后调用百炼生成向量</text></g>
      <rect x="23" y="552" width="359" height="69" rx="12" fill="#e6f2ff" stroke="#202228" stroke-width="2"/><text x="38" y="579" font-size="20">🔒</text><text x="70" y="577" class="b" font-size="13">私有资料不会发送给联网搜索</text><text x="70" y="601" class="s">仅检索片段会交给 DeepSeek 出题</text>
      <rect x="23" y="650" width="359" height="55" rx="15" fill="#ff8c42" stroke="#202228" stroke-width="3"/><text x="117" y="685" class="btn">选择并开始上传 →</text>
    </g>
  </g>

  <g transform="translate(982 132)"><text x="0" y="25" class="n">09</text><text x="55" y="24" class="ct">Agent 多源检索</text><text x="55" y="45" class="s">私有优先，按需联网</text>
    <g transform="translate(0 67)" filter="url(#hard)"><rect width="405" height="760" rx="38" fill="#fff8d8" stroke="#202228" stroke-width="4"/><rect x="146" width="113" height="29" rx="0 0 18 18" fill="#202228"/><line x1="0" y1="77" x2="405" y2="77" stroke="#202228" stroke-opacity=".12" stroke-width="2"/><text x="20" y="52" font-size="25">‹</text><text x="166" y="52" class="nav">准备题目</text><rect x="320" y="29" width="66" height="29" rx="16" fill="#fff" stroke="#bbb49d"/><text x="332" y="49" class="nav">••  ◉</text>
