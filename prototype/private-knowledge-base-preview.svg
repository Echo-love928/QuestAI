  <text x="55" y="65" class="title">鱼仔的私有资料柜</text><text x="55" y="95" class="lead">AI闯关学习 · 私有知识库关键页面预览</text>

  <g transform="translate(54 132)"><text x="0" y="25" class="n">02</text><text x="55" y="24" class="ct">知识库列表</text><text x="55" y="45" class="s">管理多个资料主题</text>
    <g transform="translate(0 67)" filter="url(#hard)"><rect width="405" height="760" rx="38" fill="#fff8d8" stroke="#202228" stroke-width="4"/><rect x="146" width="113" height="29" rx="0 0 18 18" fill="#202228"/><line x1="0" y1="77" x2="405" y2="77" stroke="#202228" stroke-opacity=".12" stroke-width="2"/><text x="20" y="52" font-size="25">‹</text><text x="153" y="52" class="nav">我的资料库</text><rect x="320" y="29" width="66" height="29" rx="16" fill="#fff" stroke="#bbb49d"/><text x="332" y="49" class="nav">••  ◉</text>
      <text x="23" y="125" class="h">资料分柜放，</text><text x="23" y="160" class="h">找起来不迷路。</text><text x="23" y="185" class="sub">2 / 5 个知识库</text><rect x="292" y="113" width="89" height="40" rx="13" fill="#ff8c42" stroke="#202228" stroke-width="3"/><text x="308" y="139" class="btn">＋ 新建</text>
      <g transform="translate(22 220)"><rect y="-11" width="102" height="17" rx="7" fill="#ffd93d" stroke="#202228" stroke-width="3"/><rect width="360" height="145" rx="8 19 19 19" fill="#fffdf4" stroke="#202228" stroke-width="3"/><rect x="16" y="20" width="77" height="22" rx="11" fill="#dff7e9" stroke="#202228" stroke-width="2"/><text x="27" y="35" class="tag" fill="#176e4c">● 可用于出题</text><text x="16" y="70" class="b">客服新人训练营</text><text x="16" y="94" class="s">4 份文档 · 326 个知识片段</text><text x="16" y="125" class="s">更新于 10 分钟前</text><text x="333" y="126" font-size="25">›</text></g>
